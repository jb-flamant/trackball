# --- Configuration Zephyr : trackball RP2040-Zero + PMW3610 (souris HID USB) ---

# Bus et E/S nécessaires au capteur
CONFIG_GPIO=y
CONFIG_SPI=y

# Sous-système input : le driver PMW3610 publie des évènements INPUT_EV_REL
CONFIG_INPUT=y

# --- USB : nouveau stack (device_next) ---
# Le stack legacy (CONFIG_USB_DEVICE_STACK) est déprécié et supprimé en Zephyr 4.5.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y       # classe HID (souris)
CONFIG_USBD_CDC_ACM_CLASS=y     # classe CDC-ACM (console de debug)

# Numéro de série USB dérivé de l'identifiant unique du RP2040
CONFIG_HWINFO=y

# Journalisation sur la console USB CDC-ACM (voir chosen dans l'overlay)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# --- Driver PMW3610 ---
# Driver fourni en amont par Zephyr (drivers/input, compatible "pixart,pmw3610").
# Auto-activé dès que le noeud existe dans le devicetree ; explicite ici.
CONFIG_INPUT_PMW3610=y

# --- Boutons (gpio-keys) ---
CONFIG_INPUT_GPIO_KEYS=y
