# --- Configuration Zephyr : trackball RP2040-Zero + PMW3610 ---

# Bus et E/S nécessaires au capteur
CONFIG_GPIO=y
CONFIG_SPI=y

# Sous-système input : le driver PMW3610 publie des évènements INPUT_EV_REL
CONFIG_INPUT=y

# Journalisation (sortie sur la console USB CDC, voir overlay)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console sur USB CDC-ACM (le RP2040-Zero n'a pas d'UART cablée en façade)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Trackball RP2040-Zero"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- Driver PMW3610 (module hors-arbre badjeff/zmk-pmw3610-driver) ---
# Active le driver ; le compatible DT associé est "pixart,pmw3610-alt".
CONFIG_PMW3610_ALT=y
# ATTENTION : ce module tire des symboles ZMK (ex. CONFIG_ZMK_POINTING).
# Pour une application Zephyr pure, voir README (shim ou fork de-ZMKifié).
